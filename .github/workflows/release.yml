name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          (cd release && zip -r ../proton-drive-sync.zip .)

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" proton-drive-sync.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
