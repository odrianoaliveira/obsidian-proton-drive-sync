name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          (cd release && zip -r ../proton-drive-sync.zip .)

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { found=1 }
            found && /^## / && index($0, ver) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry for ${GITHUB_REF_NAME}." > release-notes.md
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" proton-drive-sync.zip --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
